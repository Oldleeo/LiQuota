name: build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore .\LiQuota.csproj
      - name: Build
        run: dotnet build .\LiQuota.csproj -c Release --no-restore
      - name: Smoke tests
        run: dotnet run --project .\tests\LiQuota.SmokeTests\LiQuota.SmokeTests.csproj -c Release

  publish:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file executable
        shell: pwsh
        run: >-
          dotnet publish .\LiQuota.csproj -c Release -r ${{ matrix.runtime }}
          --self-contained true -p:PublishSingleFile=true -p:DebugType=None
          -p:DebugSymbols=false -o .\artifacts\${{ matrix.runtime }}
      - uses: actions/upload-artifact@v7
        with:
          name: LiQuota-${{ matrix.runtime }}
          path: artifacts/${{ matrix.runtime }}/LiQuota.exe
          if-no-files-found: error
