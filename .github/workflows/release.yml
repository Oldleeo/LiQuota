name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test and package
        shell: pwsh
        run: .\scripts\build-release.ps1
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          .\artifacts\LiQuota-win-x64.zip
          .\artifacts\LiQuota-win-arm64.zip
          .\artifacts\SHA256SUMS.txt
          --verify-tag --generate-notes --title "LiQuota $env:GITHUB_REF_NAME"
